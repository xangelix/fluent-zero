[package]
name = "fluent-zero"
description = "A zero-allocation, high-performance Fluent localization loader optimized for GUIs and games via compile-time caching to return &'static str for static messages."
version = "0.1.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
documentation = "https://docs.rs/fluent-zero"
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
arc-swap = "1.4"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
phf = { version = "0.14", features = ["macros"] }
unic-langid = "0.9"
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }

[features]
# Log every `LookupError` with `tracing::warn!` (target `fluent_zero`).
tracing = ["dep:tracing"]
