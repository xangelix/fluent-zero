[package]
name = "fluent-zero-integration"
description = "End-to-end tests: real fluent-zero-build output compiled and checked against fluent-zero."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
fluent-zero = { path = "../fluent-zero" }

[build-dependencies]
fluent-zero-build = { path = "../fluent-zero-build" }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "lookup"
harness = false
