[package]
name = "fluent-zero-build"
description = "Build-time code generator for fluent-zero. It compiles Fluent (.ftl) files into static, zero-allocation Rust code and Perfect Hash Maps."
version = "0.1.5"
edition = "2024"
license = "MIT"
readme = "../README.md"
documentation = "https://docs.rs/fluent-zero-build"
repository = "https://github.com/xangelix/fluent-zero-build"
categories = [
    "localization",
    "internationalization",
    "gui",
    "caching",
    "game-development",
]
keywords = ["fluent", "i18n", "zero-allocation", "static", "l10n"]

[dependencies]
fluent-bundle = "0.16"
fluent-syntax = "0.12"
fluent-langneg = { version = "0.13", features = ["cldr"] }
unic-langid = { version = "0.9", features = ["likelysubtags"] }
phf_codegen = "0.14"
